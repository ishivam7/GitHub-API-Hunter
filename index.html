<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GitHub API Hunter | Shivam Dubey</title>

    <link rel="icon"
        href="https://github.githubassets.com/favicons/favicon.png">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <!-- Theme Button -->
        <div class="top-bar">

            <button id="themeBtn">
                🌙
            </button>

        </div>

        <!-- Heading -->

        <h1>

            <i class="fa-brands fa-github"></i>

            GitHub API Hunter

        </h1>

        <div class="search-box">

            <div class="input-box">

                <input
                    type="text"
                    id="username"
                    placeholder="Enter GitHub Username">

                <span id="clearBtn">&times;</span>

            </div>

            <button id="searchBtn">

                <i class="fa-solid fa-magnifying-glass"></i>

                Search

            </button>

        </div>


        <div id="welcome">

            <h2>Welcome</h2>

            <p>

                Search any GitHub user to view profile information.

            </p>

        </div>

        <div id="loading" class="loading hidden">

            Loading...

        </div>

        <div id="error" class="error hidden">

        </div>

        <div id="profile">

        </div>

        <div id="repos">

        </div>

        <div class="history">

            <h2>

                <i class="fa-solid fa-clock-rotate-left"></i>

                Recent Searches

            </h2>

            <ul id="historyList">

            </ul>

        </div>
        <footer>

            Made by Shivam Dubey

        </footer>

    </div>

    <script src="script.js"></script>

</body>

</html>
